name: Gold Volatility Alert

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  check-gold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check gold volatility
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          GOLD_THRESHOLD_USD: "50"
          GOLD_WINDOW_MINUTES: "10"
          ALERT_COOLDOWN_MINUTES: "0"
        run: python gold_alert.py

      - name: Commit cooldown state
        run: |
          git config user.name "gold-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add gold_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update alert state"
          git push || true
